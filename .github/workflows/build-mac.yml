name: Build and verify Mac portable
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', '.github/workflows/build-mac.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-mac.yml']
permissions:
  contents: read
concurrency:
  group: mac-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build verified universal Streamland launcher
        run: node scripts/build-mac-launcher.mjs
      - name: Prepare verified Intel and Apple Silicon runtimes
        run: |
          node --input-type=module -e "import {prepareYtdlp} from './scripts/vendor-ytdlp.mjs'; import {prepareRuntime} from './scripts/vendor-runtime.mjs'; await prepareYtdlp(process.cwd(),{platforms:['darwin']}); await prepareRuntime(process.cwd(),'darwin');"
          target=$(node -p "process.arch === 'arm64' ? 'darwin-arm64' : 'darwin-x64'")
          echo "$PWD/vendor/runtime/$target" >> "$GITHUB_PATH"
          echo "$PWD/vendor/yt-dlp/darwin" >> "$GITHUB_PATH"
      - name: Check application syntax
        run: |
          node scripts/check.mjs
      - name: Verify review 15 and 16 regressions
        run: |
          node --test --test-concurrency=1 test/review15-*.test.mjs test/review16-*.test.mjs
      - name: Verify native media and late destination joining
        run: |
          npm run test:live
          npm run test:wire
          node scripts/soak-check.mjs --seconds 30 --streams 7
      - name: Verify synthetic live browser and independent recording
        run: |
          npm run test:live:browser
      - name: Verify interface controls and responsive layouts
        timeout-minutes: 5
        run: |
          qa="$RUNNER_TEMP/streamland-ui-qa"
          npm install --prefix "$qa" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          GO_STREAMS_PLAYWRIGHT_PACKAGE="$qa/package.json" npm run test:ui
      - name: Verify recorder composition and saved formats
        timeout-minutes: 5
        run: |
          qa="$RUNNER_TEMP/streamland-ui-qa"
          GO_STREAMS_PLAYWRIGHT_PACKAGE="$qa/package.json" npm run test:recorder:browser
      - name: Complete ten regression review cycles
        run: |
          npm run test:review
      - name: Build and exercise the native Mac application
        run: |
          node scripts/build.mjs --platform=darwin
          version=$(node -p "require('./package.json').version")
          node scripts/verify-mac-runtime.mjs "release/Streamland-$version-mac/Streamland.app"
      - name: Package Mac portable
        run: python scripts/package-mac-portable.py
      - name: Upload Mac package and verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Streamland-Mac-Portable
          path: |
            app/release/*Mac-Portable.zip
            app/release/*Mac-Portable-verification.json
            app/release/*Mac-runtime-verification.json
            app/vendor/mac-launcher/Streamland
            app/vendor/mac-launcher/manifest.json
            app/release/*live-studio*-verification.json
            app/release/*review*-verification.json
            app/release/*recorder*-verification.json
            app/.tmp/recorder-browser/*.png
            app/.tmp/recorder-browser/result.json
            app/.tmp/review-loop/*.log
            app/.tmp/ui-check/result.json
            app/.tmp/soak-result.json
            app/.tmp/ui-check/*.png
          if-no-files-found: error
          retention-days: 30
