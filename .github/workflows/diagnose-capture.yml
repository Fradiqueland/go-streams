name: Diagnose native Electron capture
on:
  pull_request:
    paths: ['.github/workflows/diagnose-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Prepare pinned Electron and isolated fixture
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'streamland-capture-probe'
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          $toolchain = Get-Content app/electron/toolchain.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $toolchain.url -OutFile "$probeRoot/electron.zip"
          if ((Get-FileHash "$probeRoot/electron.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $toolchain.sha256) { throw 'Electron checksum mismatch' }
          Expand-Archive "$probeRoot/electron.zip" "$probeRoot/runtime"
          New-Item -ItemType Directory -Path "$probeRoot/runtime/resources/app" | Out-Null
          '{"name":"streamland-capture-probe","version":"1.0.0","main":"main.cjs"}' | Set-Content "$probeRoot/runtime/resources/app/package.json"
          @'
          const {app,BrowserWindow,session}=require('electron');
          const http=require('node:http'),fs=require('node:fs'),path=require('node:path'),Module=require('node:module');
          const root=process.env.RUNNER_TEMP+'/streamland-capture-probe';
          const policyPath=path.join(process.env.GITHUB_WORKSPACE,'app/electron/capture-policy.cjs');
          const original=require(policyPath);
          const source=fs.readFileSync(policyPath,'utf8');
          if(!source.includes('request.securityOrigin!==base'))throw Error('Unexpected source');
          const candidate=new Module(policyPath,module);candidate.filename=policyPath;candidate.paths=Module._nodeModulePaths(path.dirname(policyPath));
          candidate._compile(source.replace('request.securityOrigin!==base','!appUrl(request.securityOrigin,base)'),policyPath);
          app.setPath('userData',path.join(root,'profile'));app.enableSandbox();
          const proof={electron:process.versions.electron,results:[]};
          const save=()=>fs.writeFileSync(path.join(root,'proof.json'),JSON.stringify(proof,null,2));
          const watchdog=setTimeout(()=>{proof.timeout=true;save();app.exit(2);},60000);
          app.whenReady().then(async()=>{
            const server=http.createServer((req,res)=>{res.setHeader('Content-Type','text/html');res.end('<!doctype html><title>Streamland synthetic capture</title><body style="background:#114477;color:white"><h1>Streamland capture fixture</h1></body>');});
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));const base='http://127.0.0.1:'+server.address().port;
            for(const [name,policy]of [['original',original],['normalized-origin',candidate.exports]]){
              const record={name,events:[]};proof.results.push(record);
              const ses=session.fromPath(path.join(root,name));
              const win=new BrowserWindow({show:false,width:640,height:480,webPreferences:{session:ses,nodeIntegration:false,contextIsolation:true,sandbox:true,backgroundThrottling:false,offscreen:true}});
              const wrapped={
                setPermissionCheckHandler:fn=>ses.setPermissionCheckHandler((...args)=>{const allowed=fn(...args);record.events.push({kind:'check',permission:args[1],origin:args[2],allowed});return allowed;}),
                setPermissionRequestHandler:fn=>ses.setPermissionRequestHandler(fn),
                setDisplayMediaRequestHandler:fn=>ses.setDisplayMediaRequestHandler((request,callback)=>{
                  record.events.push({kind:'request',securityOrigin:request.securityOrigin,base,frameMatches:request.frame===win.webContents.mainFrame,userGesture:request.userGesture,videoRequested:request.videoRequested});
                  fn(request,value=>{record.events.push({kind:'answer',granted:!!value});callback(value);});
                })
              };
              policy.wireCapturePermissions(wrapped,{contents:win.webContents,base,confirmMedia:async()=>false,getSources:async()=>[win.webContents.mainFrame],chooseSource:async sources=>sources[0]});
              await win.loadURL(base+'/');
              record.result=await Promise.race([
                win.webContents.executeJavaScript("(async()=>{try{const stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,systemAudio:'include'});const result={ok:true,tracks:stream.getVideoTracks().map(t=>({kind:t.kind,state:t.readyState}))};stream.getTracks().forEach(t=>t.stop());return result;}catch(e){return {ok:false,name:e.name,message:e.message};}})()",true),
                new Promise(resolve=>setTimeout(()=>resolve({timeout:true}),15000))
              ]);
              save();win.destroy();
            }
            server.closeAllConnections();server.close();clearTimeout(watchdog);save();
            app.exit(!proof.results[0].result.ok&&proof.results[1].result.ok?0:1);
          }).catch(error=>{proof.error=error.stack;save();app.exit(1);});
          '@ | Set-Content "$probeRoot/runtime/resources/app/main.cjs"
      - name: Exercise actual display capture requests
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'streamland-capture-probe'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $probeProcess = Start-Process "$probeRoot/runtime/electron.exe" -PassThru -Wait -WindowStyle Hidden
          Get-Content "$probeRoot/proof.json" -Raw
          if ($probeProcess.ExitCode -ne 0) { throw "Capture probe failed: $($probeProcess.ExitCode)" }
